[project]
name = "simple-local-rag"
version = "0.1.0"
description = "Simple local RAG pipeline with Qwen3-0.6B, Qwen3-Embedding-0.6B and ChromaDB — fully offline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "transformers>=4.51",
    "accelerate",
    "sentence-transformers>=3.0",
    "numpy",
    "chromadb",
    "python-dotenv",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
