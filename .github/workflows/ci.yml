name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "ai/**"]

jobs:
  lint:
    name: Python style check (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/rag-management

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          working-directory: src/rag-management

      - name: Install dependencies
        run: |
          uv python install $(cat .python-version)
          uv sync

      - name: Ruff lint
        run: uvx ruff check .

      - name: Ruff format check
        run: uvx ruff format --check .
