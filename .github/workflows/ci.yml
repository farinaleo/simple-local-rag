name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "ai/**"]

jobs:
  lint:
    name: Python style check (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/rag-management

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          working-directory: src/rag-management

      - name: Install dependencies
        run: |
          uv python install $(cat .python-version)
          uv sync

      - name: Ruff lint
        run: uvx ruff check .

      - name: Ruff format check
        run: uvx ruff format --check .

  commit-format:
    name: Commit message format
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commits follow gitmoji(type) title format
        run: |
          set -e
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          FAIL=0
          for sha in $(git rev-list --no-merges ${BASE}..${HEAD}); do
            MSG=$(git log -1 --format=%s ${sha})
            # <gitmoji>(type) lowercase title
            if ! echo "${MSG}" | grep -qE '^.\S*\([a-z0-9-]+\) [a-z].*'; then
              echo "❌ Invalid commit subject: '${MSG}'"
              echo "   Expected: <gitmoji>(type) lowercase title  (e.g. ✨(backend) add feature)"
              FAIL=1
            else
              echo "✅ ${MSG}"
            fi
          done
          exit ${FAIL}
