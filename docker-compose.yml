services:
  # Central orchestration: each service's build context points to its module,
  # so module-specific needs (Dockerfile, deps) stay colocated with the logic.

  postgres:
    # pgvector image: PostgreSQL with the vector extension available.
    # Enabled per-database by the backend migrations.
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag
    volumes:
      # Named volume only — host bind mounts broke sqlite writes on the POC;
      # same lesson applies to the database files.
      - rag_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    # Broker for the Celery ingestion worker.
    image: redis:7-alpine
    container_name: rag-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: src/rag-api
    container_name: rag-api
    environment:
      DEBUG: "true"
      SECRET_KEY: dev-only
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/rag
      CELERY_BROKER_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    # Celery ingestion worker: same image as the api, celery entrypoint.
    # The embedding model is baked into the image at build time.
    build:
      context: src/rag-api
    container_name: rag-worker
    command: uv run celery -A config worker --loglevel=info --concurrency=1
    environment:
      DEBUG: "true"
      SECRET_KEY: dev-only
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/rag
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    # React SPA: built in Docker, served by nginx (SPA routing fallback).
    build:
      context: src/rag-web
    container_name: rag-web
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  rag_pgdata:
