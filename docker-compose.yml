# All runtime configuration comes from the single root .env file
# (see .env.example); real environment variables take precedence.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: rag
    volumes:
      - rag_pgdata:/var/lib/postgresql/data
    networks:
      - rag_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rag-redis
    networks:
      - rag_backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: src/rag-api
      args:
        # Optional: set HF_TOKEN in your shell or a root .env file for
        # higher rate limits when downloading the models at build time.
        HF_TOKEN: ${HF_TOKEN:-}
    container_name: rag-api
    environment:
      DEBUG: ${DEBUG:-true}
      SECRET_KEY: ${SECRET_KEY:-dev-only}
      API_VERSION: ${API_VERSION:-4.0.0}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/rag
      CELERY_BROKER_URL: redis://redis:6379/0
      UPLOAD_DIR: /data/uploads
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,api,nginx}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      MODEL_NAME: ${MODEL_NAME:-Qwen/Qwen3-0.6B}
      MAX_NEW_TOKENS: ${MAX_NEW_TOKENS:-512}
      ENABLE_THINKING: ${ENABLE_THINKING:-false}
      HISTORY_TURNS: ${HISTORY_TURNS:-6}
      TOP_K: ${TOP_K:-3}
      MAX_DISTANCE: ${MAX_DISTANCE:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MEDIA_DIR: /data/media
    volumes:
      # Uploaded files must be reachable by the worker too; a named volume
      # shared between api and worker makes the storage path consistent.
      - rag_uploads:/data/uploads
      # Avatars and other user media: written by the api, served by nginx.
      - rag_media:/data/media
    networks:
      - rag_backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "uv run python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    # Celery ingestion worker: same image as the api, celery entrypoint.
    build:
      context: src/rag-api
      args:
        HF_TOKEN: ${HF_TOKEN:-}
    container_name: rag-worker
    command: uv run celery -A config worker --loglevel=info --concurrency=1
    environment:
      DEBUG: ${DEBUG:-true}
      SECRET_KEY: ${SECRET_KEY:-dev-only}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/rag
      CELERY_BROKER_URL: redis://redis:6379/0
      UPLOAD_DIR: /data/uploads
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - rag_uploads:/data/uploads
    networks:
      - rag_backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "uv run celery -A config inspect ping -d celery@$$(hostname) | grep -q OK"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  web:
    # React SPA: built in Docker, served by nginx (SPA routing fallback).
    build:
      context: src/rag-web
    container_name: rag-web
    networks:
      - rag_backend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget resolves localhost to
      # ::1 where the SPA nginx does not listen (IPv4 only).
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  nginx:
    # Reverse proxy: single public entrypoint, / -> web, /api/ -> api.
    image: nginx:alpine
    container_name: rag-nginx
    volumes:
      - ./nginx/reverse-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - rag_media:/data/media:ro
    ports:
      - "8080:80"
    networks:
      - rag_backend
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/health/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

networks:
  rag_backend:

volumes:
  rag_pgdata:
  rag_uploads:
  rag_media:
