# Reverse proxy: single entrypoint routing / to the SPA and /api/ to Django.
# SSE streaming (chat answers) requires proxy_buffering off.
# Upstreams are resolved per request through the embedded Docker DNS:
# a recreated api/web container changes IP, and nginx would otherwise
# keep proxying to the stale IP cached at startup (502 after rebuild).
server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;


    # User media (avatars): served straight from the shared volume written
    # by the api container; Django only serves it in DEBUG mode.
    location /media/ {
        alias /data/media/;
        expires 7d;
    }

    # Default nginx limit is 1 MB and would reject avatar uploads (413)
    # before they reach Django, which accepts files up to 5 MB.
    client_max_body_size 6m;


    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    location / {
        set $web_upstream http://web:80;
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
    }
}
