# Ruff configuration — enforced by CI (ruff check + ruff format)
# NOTE: in a dedicated ruff.toml, keys are top-level (no [tool.ruff] prefix).

line-length = 100
target-version = "py311"

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import order)
    "B",   # bugbear (common bugs)
    "UP",  # pyupgrade (modern syntax)
]

[lint.isort]
known-first-party = ["rag"]
