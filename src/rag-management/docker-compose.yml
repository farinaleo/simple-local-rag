services:
  rag:
    build:
      context: .
      # For gated models, uncomment:
      # secrets:
      #   - hf_token
    container_name: rag-qwen
    env_file: .env
    volumes:
      - ./chroma_db:/app/chroma_db   # persistent vector index
      - ./docs:/app/docs             # editable documents, no rebuild needed
    environment:
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    stdin_open: true
    tty: true
    # GPU (requires nvidia-container-toolkit; also switch the Dockerfile to a CUDA torch index):
