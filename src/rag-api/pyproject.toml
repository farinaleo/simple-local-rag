[project]
name = "simple-local-rag-api"
version = "0.1.0"
description = "Django + DRF backend exposing the RAG APIs (documents, query)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.6.3",
    "django>=5.1",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.15",
    "pgvector[django]>=0.5.0",
    "psycopg[binary]>=3.2",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.0",
    "sentence-transformers>=6.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
